<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="dashboard-header">
  <div class="dashboard-header__title">Dashboard</div>
  <nav class="dashboard-header__nav">
    <span>Home</span>
    <span>Profile</span>
    <span>Logout</span>
  </nav>
</header>

<div class="dashboard-container">
  <aside class="dashboard-sidebar">
    <div>Menu 1</div>
    <div>Menu 2</div>
    <div>Menu 3</div>
  </aside>

  <main class="dashboard-main">
    <div class="dashboard-cards">
      <div class="dashboard-card">Users</div>
      <div class="dashboard-card">Orders</div>
      <div class="dashboard-card">Revenue</div>
         </div>

    <div class="dashboard-actions">
      <button onclick="loadData()">Load Data</button>
    </div>

    <div id="data" class="dashboard-data"></div>
  </main>
</div>

<script src="script.js"></script>
</body>
</html>
